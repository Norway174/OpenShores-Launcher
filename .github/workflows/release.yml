name: Release launcher

on:
  push:
    branches: ['main']

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version against release tags
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $changed = -not [bool](git tag --list | Where-Object { $_ -ceq "v$current" })
          $previousTag = git describe --tags --abbrev=0 HEAD
          if ($LASTEXITCODE -ne 0) { $previousTag = '' }
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$current" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

  build-windows:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable launcher
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows
          path: dist/OpenShores-Launcher.exe

  build-linux:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: Install tauri CLI
        run: cargo install tauri-cli@2.11.4

      - name: Build portable launcher
        run: npm run dist:linux

      - name: Rename binary
        run: mv ./src-tauri/target/release/bundle/appimage/*.AppImage dist/OpenShores-Launcher-amd64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-linux
          path: dist/OpenShores-Launcher-amd64.AppImage

  publish-release:
    needs: [build-linux, build-windows, detect-version-change]
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-windows
          path: OpenShores-Launcher.exe
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-linux
          path: OpenShores-Launcher-amd64.AppImage
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          name: OpenShores Launcher ${{ needs.detect-version-change.outputs.version }}
          target_commitish: ${{ github.sha }}
          previous_tag: ${{ needs.detect-version-change.outputs.previous_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            */**/OpenShores-Launcher.exe
            */**/OpenShores-Launcher-amd64.AppImage
