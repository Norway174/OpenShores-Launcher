name: Release launcher

on:
  workflow_dispatch:
  push:
    branches: ['main']
  schedule:
    # Backstop for GitHub push events that are suppressed or not enqueued.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($current -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "package.json has an invalid semantic version: $current"
          }

          $changed = -not [bool](git tag --list "v$current")
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$current" >> $env:GITHUB_OUTPUT

  build-and-release:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable launcher
        run: npm run dist

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\OpenShores-Launcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OpenShores-Launcher.exe" | Set-Content dist\OpenShores-Launcher.exe.sha256 -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          name: OpenShores Launcher ${{ needs.detect-version-change.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OpenShores-Launcher.exe
            dist/OpenShores-Launcher.exe.sha256
