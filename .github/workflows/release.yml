name: Release launcher

on:
  push:
    branches: ['main']

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version against release tags
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($current -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "package.json has an invalid semantic version: $current"
          }

          $changed = -not [bool](git tag --list "v$current")
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$current" >> $env:GITHUB_OUTPUT

  build-windows:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable launcher
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/OpenShores-Launcher.exe

  build-linux:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-unknown-linux-gnu

      - name: Install tauri CLI
        run: cargo install tauri-cli@2.11.4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable launcher
        run: npm run dist:linux

      - name: Rename binary
        run: mv ./src-tauri/target/release/bundle/appimage/*.AppImage dist/OpenShores-Launcher-amd64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/OpenShores-Launcher-amd64.AppImage

  publish-release:
    needs: [build-linux, build-windows]
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version-change.outputs.version }}
          name: OpenShores Launcher ${{ needs.detect-version-change.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OpenShores-Launcher.exe
            dist/OpenShores-Launcher-amd64.AppImage
