<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenShores Changelog</title>
  <link rel="stylesheet" href="changelog.css">
</head>
<body>
  <main class="changelog-shell">
    <header>
      <div>
        <span class="kicker">UPDATE CHANGELOG</span>
        <h1 id="changelog-title">Release notes</h1>
      </div>
      <button id="open-release" class="primary" type="button">Open release on GitHub</button>
    </header>
    <article id="changelog-content" aria-live="polite">Loading release notes...</article>
    <footer>
      <span>OpenShores update history</span>
      <button id="close-changelog" class="secondary" type="button">Close</button>
    </footer>
  </main>
  <script src="changelog.js"></script>
</body>
</html>
